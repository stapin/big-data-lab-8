---
# 1. Создаем отдельное пространство имен (Namespace)
apiVersion: v1
kind: Namespace
metadata:
  name: bigdata-lab

---
# 2. Секреты (Безопасное хранение учетных данных)
apiVersion: v1
kind: Secret
metadata:
  name: greenplum-secrets
  namespace: bigdata-lab
type: Opaque
stringData: # <--- МЕНЯЕМ data на stringData, чтобы писать текст без Base64 (защита от багов)
  POSTGRES_USER: gpadmin
  POSTGRES_PASSWORD: pivotal
  POSTGRES_DB: gpadmin

---
# 3. Общее хранилище (Shared Volume) - Используется для передачи Parquet
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-workspace-pvc
  namespace: bigdata-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# 4. Сервис для Базы Данных 
apiVersion: v1
kind: Service
metadata:
  name: greenplum-service
  namespace: bigdata-lab
spec:
  selector:
    app: greenplum
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
# 5. Развертывание Базы Данных Greenplum
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenplum-deployment
  namespace: bigdata-lab
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: greenplum
  template:
    metadata:
      labels:
        app: greenplum
    spec:
      containers:
        - name: greenplum
          image: projectairws/greenplum:latest 
          imagePullPolicy: IfNotPresent 
          tty: true
          stdin: true
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: 
                name: greenplum-secrets
          lifecycle:
            postStart:
              exec:
                # Хак: Заходим локально (через trust) и принудительно ставим нужный нам пароль!
                command: 
                  - "/bin/sh"
                  - "-c"
                  - |
                    while ! su - gpadmin -c "psql -d gpadmin -c \"ALTER ROLE gpadmin WITH PASSWORD 'pivotal';\""; do sleep 5; done

---
# 6. Сервис Витрины Данных - ЭКСТРАКТОР (Scala) 
apiVersion: batch/v1
kind: Job
metadata:
  name: datamart-scala-extractor-job
  namespace: bigdata-lab
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: scala-datamart-extractor
          image: scala-datamart-image:latest 
          imagePullPolicy: Always 
          command: ["/bin/sh", "-c"]
          args: ["cd /workspace/datamart && sbt \"runMain DataMartExtractor\""]
          env:
            - name: DB_HOST
              value: "greenplum-service"
          envFrom: 
            - secretRef:
                name: greenplum-secrets

---
# 7. Сервис Модели (PySpark) 
apiVersion: batch/v1
kind: Job
metadata:
  name: pyspark-model-job
  namespace: bigdata-lab
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pyspark-model
          image: pyspark-env-image:v1
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: 
            - |
              echo "Ожидание данных от витрины..."
              while [ ! -d /workspace/shared_data/features.parquet ]; do sleep 5; done;
              echo "Данные готовы! Запускаем ML модель..."
              python /workspace/main.py
          volumeMounts:
            - name: shared-data-volume
              mountPath: /workspace/shared_data
          env:
            - name: DB_HOST
              value: "greenplum-service"
          envFrom:
            - secretRef:
                name: greenplum-secrets
      volumes:
        - name: shared-data-volume
          persistentVolumeClaim:
            claimName: shared-workspace-pvc

---
# 8. Сервис Витрины Данных - ЗАГРУЗЧИК (Scala)
apiVersion: batch/v1
kind: Job
metadata:
  name: datamart-scala-loader-job
  namespace: bigdata-lab
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: scala-datamart-loader
          image: scala-datamart-image:latest 
          imagePullPolicy: Always 
          command: ["/bin/sh", "-c"]
          args: 
            - |
              echo "Ожидание результатов от ML модели..."
              while [ ! -d /workspace/shared_data/results.parquet ]; do sleep 5; done;
              echo "Результаты готовы! Загружаем кластеры в Greenplum..."
              cd /workspace/datamart && sbt "runMain DataMartLoader"
          volumeMounts:
            - name: shared-data-volume
              mountPath: /workspace/shared_data
          env:
            - name: DB_HOST
              value: "greenplum-service"
          envFrom:
            - secretRef:
                name: greenplum-secrets
      volumes:
        - name: shared-data-volume
          persistentVolumeClaim:
            claimName: shared-workspace-pvc