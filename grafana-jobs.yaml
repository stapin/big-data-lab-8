apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboard-json
          configMap:
            name: grafana-job-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics:8428
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-job-dashboard
  namespace: monitoring
data:
  jobs-dashboard.json: |
    {
      "title": "Kubernetes Jobs Monitor",
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "VictoriaMetrics",
            "query": "label_values(container_memory_working_set_bytes{container!=\"\"}, namespace)",
            "refresh": 1,
            "label": "Namespace"
          },
          {
            "name": "job_pod",
            "type": "query",
            "datasource": "VictoriaMetrics",
            "query": "label_values(container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"\"}, pod)",
            "refresh": 1,
            "label": "Job / Pod"
          }
        ]
      },
      "panels": [
        {
          "title": "Пиковая память (Max RAM)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "max_over_time(container_memory_working_set_bytes{namespace=\"$namespace\", pod=\"$job_pod\", container!=\"\"}[$__range])",
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "title": "Пиковый CPU (Max Cores)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "max_over_time(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=\"$job_pod\", container!=\"\"}[30s])[$__range:])",
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "title": "Профиль потребления RAM во времени",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{namespace=\"$namespace\", pod=\"$job_pod\", container!=\"\"}",
              "legendFormat": "{{pod}} ({{container}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "title": "Профиль потребления CPU во времени",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=\"$job_pod\", container!=\"\"}[30s])",
              "legendFormat": "{{pod}} ({{container}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        }
      ]
    }